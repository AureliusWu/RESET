name: R2 Content Schema Migration

on:
  push:
    branches: [r2-content-schema]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2-content-schema
          fetch-depth: 0
      - name: Canonicalize content schema once
        shell: bash
        run: |
          if [ -f game/content/manifest.json ]; then
            echo "R2 content schema already materialized"
            exit 0
          fi
          node scripts/r2-content-migrate.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(content): canonicalize scenario schema"
          git push origin HEAD:r2-content-schema
