name: R4 Editorial B

on:
  push:
    branches:
      - r4-editorial-b

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r4-editorial-b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply R4 editorial patch B
        run: python scripts/r4-editorial-b.py
      - name: Commit patched chapter
        shell: bash
        run: |
          if git diff --quiet -- game/content/chapters/04.json; then
            echo "No editorial changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/content/chapters/04.json
          git commit -m "refactor(editorial): sharpen R4 route peaks and relationships"
          git push origin HEAD:r4-editorial-b
