name: Generate R5 supporting cast portraits

on:
  push:
    branches: [r5-b-supporting-cast-portraits]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[r5-support-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout R5 B branch
        uses: actions/checkout@v4
        with:
          ref: r5-b-supporting-cast-portraits
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic portrait tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Produce and integrate twelve supporting portraits
        run: python scripts/generate-r5-supporting-cast.py
      - name: Verify generated supporting cast mapping
        run: |
          node --check scripts/check-r5-supporting-cast.mjs
          node scripts/check-r5-supporting-cast.mjs
      - name: Commit generated masters, runtime derivatives and integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game package.json docs/CAST_BIBLE_R1.md scripts/assets.mjs scripts/check-release.mjs
          if git diff --cached --quiet; then
            echo 'Supporting cast output already matches the deterministic production plan.'
            exit 0
          fi
          git commit -m 'art(r5-b): integrate supporting cast portraits [r5-support-generated]'
          git push origin HEAD:r5-b-supporting-cast-portraits
