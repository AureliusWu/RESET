name: Round 9 full-game visual acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round9-visual-acceptance.yml'

permissions:
  contents: write
  actions: read

jobs:
  round9:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout locked VN Engine v2
        uses: actions/checkout@v4
        with:
          repository: AureliusWu/VN-Engine-v2
          ref: 15c101e0d2b2c1e40dbc36d7a0c1a246d102b52c
          path: vn-engine

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install engine dependencies
        working-directory: vn-engine
        run: npm ci

      - name: Enforce completed 4K migration contract
        run: |
          npm run art:legacy -- --strict
          node scripts/audit-4k-art.mjs --strict
          npm run art:check
          test "$(find game/assets -maxdepth 1 -type f -name '*.svg' | wc -l)" -eq 0

      - name: Build the exact v1.2.0-dev package
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: |
          npm run build
          npm run check:release
          npm run test:release

      - name: Install acceptance browser
        working-directory: vn-engine
        run: npx playwright install --with-deps chromium

      - name: Run full packaged browser acceptance
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: npm run test:browser

      - name: Run explicit Round 9 UI visual acceptance
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: node tests/round9-ui-visual-browser.mjs

      - name: Validate visual evidence contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          browser=load('test-results/browser/acceptance.json')
          assert browser['result']=='passed' and browser['errors']==[], browser

          production=load('test-results/browser/production-art.json')
          assert len(production['decoded'])==53, len(production['decoded'])
          assert len(production['records'])==53, len(production['records'])
          assert all(x['width'] in (1080,1920) and x['height'] in (1920,1080) for x in production['decoded'])

          linwan=load('test-results/browser/linwan-decode.json')
          assert len(linwan['decoded'])==8 and linwan['failures']==[], linwan
          layout=load('test-results/browser/linwan-layout.json')
          assert {(x['width'],x['height']) for x in layout}=={(390,844),(844,390),(800,600),(1920,1080),(3840,2160)}

          ui=load('test-results/round9-ui/acceptance.json')
          assert ui['result']=='passed' and ui['errors']==[] and len(ui['decoded'])==5, ui

          overlays=[]
          for name in ['game/content/zz-art-v1.json','game/content/zzz-scene-art-v1.json','game/content/zzzz-anomaly-art-v1.json']:
              overlays.extend(load(name)['replaceAssets'])
          assert len(overlays)==58, len(overlays)
          assert len({a['id'] for a in overlays})==58
          assert all(a['src'].startswith('assets/4k/runtime/') and not a['src'].endswith('.svg') for a in overlays)

          project=load('dist/project.json')
          final={a['id']:a for a in project['assets']}
          for asset in overlays:
              assert final[asset['id']]['src']==asset['src'], asset['id']
              assert Path('dist',asset['src']).is_file(), asset['src']

          ui_files=['title-key-visual.webp','save-anomaly.webp','ending-collection-header.webp','cg-gallery-header.webp','combat-hud-key-visual.webp']
          manifest=load('dist/build-manifest.json')
          packed={x['name'] for x in manifest['files']}
          for name in ui_files:
              path='assets/4k/runtime/ui/'+name
              assert Path('dist',path).is_file(), path
              assert path in packed, path

          assert len(browser['checks']) >= 20, len(browser['checks'])
          print(f"Round 9 local visual evidence OK: {len(overlays)} production refs, {len(ui_files)} UI visuals, {len(browser['checks'])} browser checks")
          PY

      - name: Upload Round 9 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: RESET-round9-visual-acceptance-${{ github.sha }}
          path: |
            test-results/browser
            test-results/round9-ui

      - name: Require sibling Build and Release validation on the same SHA
        id: siblings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['GITHUB_SHA']
          token=os.environ['GITHUB_TOKEN']
          wanted={'Build 回留','Release 回留'}
          found={}

          def runs():
              query=urllib.parse.urlencode({'head_sha':sha,'event':'push','per_page':100})
              request=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?{query}',
                  headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)['workflow_runs']

          for _ in range(120):
              by_name={run['name']:run for run in runs() if run['name'] in wanted}
              found.update(by_name)
              if wanted <= found.keys() and all(found[name]['status']=='completed' for name in wanted):
                  break
              time.sleep(15)
          else:
              raise SystemExit('Timed out waiting for same-SHA Build/Release workflows')

          for name in wanted:
              run=found[name]
              if run['conclusion']!='success':
                  raise SystemExit(f"{name} failed: {run['html_url']} conclusion={run['conclusion']}")

          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f"build_id={found['Build 回留']['id']}\n")
              output.write(f"build_url={found['Build 回留']['html_url']}\n")
              output.write(f"release_id={found['Release 回留']['id']}\n")
              output.write(f"release_url={found['Release 回留']['html_url']}\n")
          print('Same-SHA Build and Release both succeeded')
          PY

      - name: Record Round 9 completion
        env:
          BUILD_ID: ${{ steps.siblings.outputs.build_id }}
          BUILD_URL: ${{ steps.siblings.outputs.build_url }}
          RELEASE_ID: ${{ steps.siblings.outputs.release_id }}
          RELEASE_URL: ${{ steps.siblings.outputs.release_url }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, os

          sha=os.environ['GITHUB_SHA']
          run_id=os.environ['GITHUB_RUN_ID']
          build_id=os.environ['BUILD_ID']; build_url=os.environ['BUILD_URL']
          release_id=os.environ['RELEASE_ID']; release_url=os.environ['RELEASE_URL']
          browser=json.loads(Path('test-results/browser/acceptance.json').read_text(encoding='utf-8'))
          production=json.loads(Path('test-results/browser/production-art.json').read_text(encoding='utf-8'))
          ui=json.loads(Path('test-results/round9-ui/acceptance.json').read_text(encoding='utf-8'))
          timestamp=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')

          report=f'''# Round 9 — 全游戏视觉验收\n\n状态：**completed**\n\n- 验收 SHA：`{sha}`\n- Round 9 Workflow Run：`{run_id}`\n- Build 回留：Run `{build_id}` — success\n- Release 回留：Run `{release_id}` — Web / Windows success\n- 完成时间：`{timestamp}`\n\n## 验收覆盖\n\n- production 4K 引用：58 / 58，全部为 `assets/4k/runtime/`，无正式 SVG fallback。\n- 非林晚 production 图像：{len(production['decoded'])} 项逐项真实浏览器解码，并在剧情存档或明确标记的独立 renderer fixture 中渲染。\n- 林晚：8 份 runtime derivative 全部解码；五个正式表情使用真实剧情帧；另完成 390×844、844×390、800×600、1920×1080、3840×2160 五组布局验收与深/浅底 Alpha 合成复核。\n- UI 关键视觉：{len(ui['decoded'])} / 5，标题、存档异常、结局收藏、CG 图鉴、战斗 HUD 均在实际游戏界面显式挂载并解码为 1920×1080 runtime WebP。\n- 浏览器整包验收：{len(browser['checks'])} 项检查通过，包含剧情/存档/Meta/结局/CG/战斗/响应式/PWA 离线链。\n- 同 SHA `Build 回留` 与 `Release 回留` 均通过；Release Web 继续执行 v1.1.0 → v1.2.0-dev PWA 升级验收，Windows 继续执行原生 host、`RESET.exe → VNEngine.exe → game/`、最终 ZIP、WebView2 和重启持久化验收。\n\n## 边界\n\nRound 9 只做视觉与发行候选前验收，不改变剧情、asset ID、引擎锁定或正式版本。当前仍为 `v1.2.0-dev`；未创建 RC、未创建正式 Release、未覆盖 `v1.1.0 Pages`。下一轮按冻结计划进入 **Round 10 — 恢复 `v1.2.0-rc.1` 冻结流程**。\n\n## CI 证据\n\n- Build: {build_url}\n- Release: {release_url}\n- Round 9 evidence artifact: `RESET-round9-visual-acceptance-{sha}`（包含浏览器截图、production-art/林晚验收 JSON、5 张 UI 关键视觉截图与验收 JSON）。\n'''
          Path('docs/ROUND9_VISUAL_ACCEPTANCE.md').write_text(report,encoding='utf-8')

          rounds=Path('docs/ART_4K_ROUNDS.md')
          text=rounds.read_text(encoding='utf-8').rstrip()
          marker='## Round 9 — 全游戏视觉验收'
          if marker not in text:
              text += f'''\n\n{marker}\n\nRound 9 completed。58 / 58 正式 production 4K 引用、5 张 UI 关键视觉与最终 Web / Windows 包完成全游戏视觉验收。\n\n- 验收基线：`{sha}`；Round 9 Workflow Run `{run_id}`。\n- 58 个正式 production 引用全部保持 `assets/4k/runtime/`，无 SVG fallback；严格 4K 审计继续为 missing 0 / undersized 0 / missing alpha 0。\n- 浏览器对 53 个非林晚 production 图像逐项真实解码，并用真实剧情存档或明确标记的独立 renderer fixture 显示；林晚 8 个 runtime derivative 另行全部解码并复核五表情、Alpha、深浅底与五组视口。\n- 5 张 UI 关键视觉全部在实际界面显式验收：标题、存档异常、结局收藏、CG 图鉴、战斗 HUD；均为 1920×1080 runtime WebP。\n- Build 回留 Run `{build_id}` success；Release 回留 Run `{release_id}` Web / Windows success。最终 Web ZIP/PWA/离线/旧版升级与 Windows 原生 host/launcher/WebView2/重启持久化继续全部通过。\n- 完整证据写入 `docs/ROUND9_VISUAL_ACCEPTANCE.md`；截图与 JSON 作为 Round 9 Actions artifact 保存。\n- 保持 `v1.2.0-dev`，不创建 RC、不覆盖正式 `v1.1.0 Pages`。下一轮：Round 10 — 恢复 `v1.2.0-rc.1` 冻结流程。\n'''
              rounds.write_text(text+'\n',encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit Round 9 evidence
        run: |
          rm .github/workflows/round9-visual-acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROUND9_VISUAL_ACCEPTANCE.md docs/ART_4K_ROUNDS.md
          git add -u .github/workflows/round9-visual-acceptance.yml
          git commit -m 'docs(round9): complete full-game visual acceptance [skip ci]'
          git push origin HEAD:main
