name: R2 Runtime Support Migration

on:
  push:
    branches: [r2-content-schema]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ hashFiles('game/content/runtime.json') == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2-content-schema
          fetch-depth: 0
      - name: Materialize non-scene runtime metadata
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          node scripts/r2-runtime-support.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(content): preserve canonical runtime metadata"
          git push origin HEAD:r2-content-schema
