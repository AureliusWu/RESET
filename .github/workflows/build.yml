name: Build 回留

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: game-repo
      - name: Checkout VN Engine v2
        uses: actions/checkout@v4
        with:
          repository: AureliusWu/VN-Engine-v2
          ref: 15c101e0d2b2c1e40dbc36d7a0c1a246d102b52c
          path: vn-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vn-engine/package-lock.json
      - name: Install engine dependencies
        working-directory: vn-engine
        run: npm ci
      - name: Syntax check game extensions
        working-directory: game-repo
        run: |
          node --check game/runtime/combat.mjs
          node --check game/runtime/meta.mjs
          node --check game/runtime/archive.mjs
          node --check game/runtime/archive-data.mjs
          node --check game/runtime/experience.mjs
          node --check game/runtime/ui.mjs
          node --check game/runtime/pwa.mjs
          node --check scripts/generate-scenes.mjs
          node --check scripts/audit-4k-art.mjs
          node --check scripts/check-art-integrity.mjs
          node --check scripts/check-4k-production.mjs
          node --check scripts/check-art-visual-gate.mjs
          node --check scripts/check-release.mjs
          node --check tests/mobile-shell.test.mjs
      - name: Verify frozen 4K migration map
        working-directory: game-repo
        run: npm run art:audit
      - name: Compose content and package 回留
        working-directory: game-repo
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: npm run build
      - name: Candidate integrity and visual report
        working-directory: game-repo
        run: npm run check:release
      - name: Runtime, mobile shell, ending reachability and Meta regressions
        working-directory: game-repo
        run: npm run test:release
      - name: Verify v1.2.1-dev content
        working-directory: game-repo
        run: |
          node -e "const m=require('./dist/build-manifest.json'); const p=require('./dist/project.json'); if(m.game!=='reset'||m.version!=='reset-v1.2.1-dev'||p.version!=='reset-v1.2.1-dev') process.exit(1); if(!m.extensions.includes('reset-art-visual-gate-v1')) process.exit(2)"
          test -f dist/index.html
          test -f dist/project.json
          test -f dist/sw.js
          test -f dist/pwa.mjs
          test -f dist/experience.css
      - name: Confirm stable publication remains blocked pending mobile shell acceptance
        working-directory: game-repo
        run: |
          if npm run check:stable; then
            echo 'Stable gate unexpectedly passed before mobile shell acceptance' >&2
            exit 1
          fi
          echo 'Expected: character art is approved; stable publication is blocked only on title/landscape/PWA acceptance.'
      - name: Upload standalone development build
        uses: actions/upload-artifact@v4
        with:
          name: RESET-huiliu-v1.2.1-dev
          path: game-repo/dist
