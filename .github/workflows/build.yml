name: Build 回留

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: game-repo

      - name: Checkout VN Engine v2
        uses: actions/checkout@v4
        with:
          repository: AureliusWu/VN-Engine-v2
          ref: 15c101e0d2b2c1e40dbc36d7a0c1a246d102b52c
          path: vn-engine

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vn-engine/package-lock.json

      - name: Install engine dependencies
        working-directory: vn-engine
        run: npm ci

      - name: Compose content and package 回留
        working-directory: game-repo
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: npm run build

      - name: Verify package identity and third-round content
        working-directory: game-repo
        run: |
          node -e "const m=require('./dist/build-manifest.json'); const p=require('./dist/project.json'); if(m.game!=='reset'||m.version!=='reset-v0.3.0'||p.version!=='reset-v0.3.0') process.exit(1); const ids=new Set(p.scenes.map(s=>s.id)); if(!ids.has('route_focus_choice')||!ids.has('focus_linwan_open')||!ids.has('focus_xiaoman_open')||!ids.has('focus_xuqi_open')) process.exit(2); if(!p.assets.some(a=>a.id==='music-seven-chairs')||!p.assets.some(a=>a.id==='six-chairs-cg')) process.exit(3); console.log(m.engine, m.contentFingerprint, p.scenes.length, p.assets.length)"
          test -f dist/index.html
          test -f dist/project.json
          test -f dist/sw.js
          test -f dist/assets/generated/music-seven-chairs.wav
          test -f dist/assets/cg-six-chairs.svg
          test -f dist/assets/cg-letter-1842.svg

      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: RESET-huiliu-v0.3.0
          path: game-repo/dist
