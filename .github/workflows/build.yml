name: Build 回留

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: game-repo
      - name: Checkout VN Engine v2
        uses: actions/checkout@v4
        with:
          repository: AureliusWu/VN-Engine-v2
          ref: 15c101e0d2b2c1e40dbc36d7a0c1a246d102b52c
          path: vn-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vn-engine/package-lock.json
      - name: Install engine dependencies
        working-directory: vn-engine
        run: npm ci
      - name: Syntax check game extensions
        working-directory: game-repo
        run: |
          node --check game/runtime/combat.mjs
          node --check game/runtime/meta.mjs
          node --check game/runtime/archive.mjs
          node --check game/runtime/archive-data.mjs
          node --check game/runtime/experience.mjs
          node --check game/runtime/ui.mjs
          node --check game/runtime/pwa.mjs
          node --check scripts/assets.mjs
          node --check scripts/check-asset-schema.mjs
          node --check scripts/audit-4k-art.mjs
          node --check scripts/check-art-integrity.mjs
          node --check scripts/check-4k-production.mjs
          node --check scripts/check-art-visual-gate.mjs
          node --check scripts/supporting-art.mjs
          node --check scripts/apply-supporting-art.mjs
          node --check scripts/check-r5-visual-coverage.mjs
          node --check scripts/check-r5-background-coverage.mjs
          node --check scripts/check-r5-key-cg-coverage.mjs
          node --check scripts/check-r5-supporting-cast.mjs
          node --check scripts/check-r5-final-integration.mjs
          node --check scripts/check-release.mjs
          node --check tests/mobile-shell.test.mjs
          node --check tests/xujiashu-art-browser.mjs
      - name: Verify frozen 4K migration map
        working-directory: game-repo
        run: npm run art:audit
      - name: Compose content and package 回留
        working-directory: game-repo
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: npm run build
      - name: Candidate integrity and visual state
        working-directory: game-repo
        run: npm run check:release
      - name: Stable publication hard gate
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: publish v')
        working-directory: game-repo
        run: npm run check:stable
      - name: Runtime, mobile shell, ending reachability and Meta regressions
        working-directory: game-repo
        run: npm run test:release
      - name: Install candidate audit browser and CJK fonts
        working-directory: vn-engine
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Xu Jiashu candidate visual and offline audit
        working-directory: game-repo
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: npm run test:art:xujiashu
      - name: Upload candidate visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RESET-xujiashu-neutral-candidate-audit
          path: game-repo/test-results/xujiashu-neutral
          if-no-files-found: warn
      - name: Verify v1.2.2 release content
        working-directory: game-repo
        run: |
          node -e "const m=require('./dist/build-manifest.json'); const p=require('./dist/project.json'); if(m.game!=='reset'||m.version!=='reset-v1.2.2'||p.version!=='reset-v1.2.2') process.exit(1); if(!m.extensions.includes('reset-art-visual-gate-v1')||!m.extensions.includes('reset-asset-schema-v1')) process.exit(2); if(!p.scenes.some(s=>s.ending==='true-end')||p.assets.length!==97) process.exit(3)"
          test -f dist/index.html
          test -f dist/project.json
          test -f dist/sw.js
          test -f dist/pwa.mjs
          test -f dist/experience.css
      - name: Upload standalone candidate build
        uses: actions/upload-artifact@v4
        with:
          name: RESET-huiliu-v1.2.2-candidate
          path: game-repo/dist
