name: Build 回留

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: game-repo

      - name: Checkout VN Engine v2
        uses: actions/checkout@v4
        with:
          repository: AureliusWu/VN-Engine-v2
          ref: 15c101e0d2b2c1e40dbc36d7a0c1a246d102b52c
          path: vn-engine

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vn-engine/package-lock.json

      - name: Install engine dependencies
        working-directory: vn-engine
        run: npm ci

      - name: Syntax check game extensions
        working-directory: game-repo
        run: |
          node --check game/runtime/combat.mjs
          node --check game/runtime/meta.mjs
          node --check scripts/generate-portraits.mjs
          node --check scripts/check-release.mjs

      - name: Compose content and package 回留
        working-directory: game-repo
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: npm run build

      - name: Full release integrity audit
        working-directory: game-repo
        run: npm run check:release

      - name: Verify story-complete candidate
        working-directory: game-repo
        run: |
          node -e "const m=require('./dist/build-manifest.json'); const p=require('./dist/project.json'); if(m.game!=='reset'||m.version!=='reset-v0.9.0'||p.version!=='reset-v0.9.0') process.exit(1); const ids=new Set(p.scenes.map(s=>s.id)); for(const id of ['c6_save_again','c6_no_save','c6_echo_goodbye','c7_morning','c7_linwan','c7_credits']) if(!ids.has(id)) process.exit(2); const endings=new Set(p.scenes.map(s=>s.ending).filter(Boolean)); for(const id of ['normal-linwan','normal-xiaoman','normal-xuqi','normal-tinglan','normal-tangli','normal-nanxing','bad-permanent-save','true-end']) if(!endings.has(id)) process.exit(3); for(const id of ['save-room','true-dawn','true-end-riverside-cg']) if(!p.assets.some(a=>a.id===id)) process.exit(4); console.log(m.engine,m.contentFingerprint,p.scenes.length,p.assets.length,endings.size,m.extensions)"
          test -f dist/index.html
          test -f dist/project.json
          test -f dist/sw.js
          test -f dist/combat.mjs
          test -f dist/meta.mjs
          test -f dist/assets/bg-save-room.svg
          test -f dist/assets/bg-true-dawn.svg
          test -f dist/assets/cg-true-end-riverside.svg
          test -f dist/assets/generated-portraits/linwan/smile.svg
          test -f dist/assets/generated-portraits/xuqi/serious.svg

      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: RESET-huiliu-v0.9.0
          path: game-repo/dist
