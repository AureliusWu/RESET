name: R3 Fix PR A Prose

on:
  push:
    branches: [r3-narrative-a]

permissions:
  contents: write

jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'chore(r3): finalize chapter 1-2 prose') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r3-narrative-a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply prose cleanup
        run: node scripts/r3-fix-a.mjs
      - name: Validate scenario
        run: npm run scenario:check
      - name: Commit prose cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/content/chapters/01.json game/content/chapters/02.json
          git diff --cached --check
          git commit -m "chore(r3): finalize chapter 1-2 prose"
          git push origin HEAD:r3-narrative-a
