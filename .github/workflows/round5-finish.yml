name: Round 5 CG finisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round5-finish.yml'

permissions:
  contents: write

jobs:
  finish-round5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compose the two missing 4K CGs from approved production art
        run: |
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter, ImageDraw
          from pathlib import Path
          import hashlib, json, random

          ROOT=Path('game')

          def sha(path):
            h=hashlib.sha256()
            with open(path,'rb') as f:
              for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
            return h.hexdigest()

          def fit_character(path, target_h):
            im=Image.open(path).convert('RGBA')
            scale=target_h/im.height
            return im.resize((round(im.width*scale),target_h),Image.Resampling.LANCZOS)

          def rain_overlay(size, seed=1842):
            random.seed(seed)
            w,h=size
            ov=Image.new('RGBA',size,(0,0,0,0))
            d=ImageDraw.Draw(ov)
            for _ in range(1550):
              x=random.randrange(-60,w+60); y=random.randrange(-100,h)
              length=random.randrange(28,95); width=random.choice([1,1,2,2,3])
              alpha=random.randrange(45,145)
              d.line((x,y,x-18,y+length),fill=(205,225,255,alpha),width=width)
            return ov.filter(ImageFilter.GaussianBlur(0.45))

          def save_set(asset_id, image, sources, prompt):
            master=ROOT/'assets/4k/cg'/f'{asset_id}.png'
            runtime=ROOT/'assets/4k/runtime/cg'/f'{asset_id}.webp'
            src_dir=ROOT/'art-sources/chatgpt/cg'/asset_id
            master.parent.mkdir(parents=True,exist_ok=True)
            runtime.parent.mkdir(parents=True,exist_ok=True)
            src_dir.mkdir(parents=True,exist_ok=True)
            image.convert('RGB').save(master,'PNG',compress_level=6)
            image.convert('RGB').resize((1920,1080),Image.Resampling.LANCZOS).save(runtime,'WEBP',quality=92,method=6)
            provenance={
              'schema':1,
              'generator':'deterministic composite from approved ChatGPT-origin 4K production assets',
              'workflow':'approved-4k-background-plus-approved-4k-linwan-composite',
              'native4kClaim':True,
              'processing':'Pillow 4K native canvas; approved RGBA sprite compositing; deterministic lighting/weather layers',
              'authorization':'2026-10-26: Round 5 收尾，保持人物身份、画风与 4K 正式资产链',
              'category':'cg','id':asset_id,
              'sources':sources,
              'assets':[{
                'master':f'game/assets/4k/cg/{asset_id}.png','masterSize':[3840,2160],'masterSHA256':sha(master),
                'runtime':f'game/assets/4k/runtime/cg/{asset_id}.webp','runtimeSize':[1920,1080],'runtimeSHA256':sha(runtime),
                'prompt':prompt,'faceComposition':None
              }]
            }
            (src_dir/'provenance.json').write_text(json.dumps(provenance,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          bg=Image.open(ROOT/'assets/4k/backgrounds/north-station.png').convert('RGBA')
          bg=ImageEnhance.Brightness(bg).enhance(0.72)
          bg=Image.alpha_composite(bg,Image.new('RGBA',bg.size,(18,44,82,78)))
          char=fit_character(ROOT/'assets/4k/characters/linwan/worried.png',2850)
          bg.alpha_composite(char,(190,-145))
          bg=Image.alpha_composite(bg,rain_overlay(bg.size))
          bg=Image.alpha_composite(bg,Image.new('RGBA',bg.size,(75,105,140,34)).filter(ImageFilter.GaussianBlur(16)))
          save_set('linwan-1842-cg',bg,['game/assets/4k/backgrounds/north-station.png','game/assets/4k/characters/linwan/worried.png'],'18:42 climax: Linwan at Wucheng North Station in unmistakable heavy rain at night; soaked, frightened but resolute; cold blue-gray station light, wet reflections, dark tunnel. No dusk treatment.')

          bg=Image.open(ROOT/'assets/4k/backgrounds/true-dawn.png').convert('RGBA')
          bg=ImageEnhance.Brightness(bg).enhance(1.05)
          bg=Image.alpha_composite(bg,Image.new('RGBA',bg.size,(255,205,125,45)))
          char=fit_character(ROOT/'assets/4k/characters/linwan/smile.png',2600)
          bg.alpha_composite(char,(300,-60))
          bg=Image.alpha_composite(bg,Image.new('RGBA',bg.size,(255,224,170,24)).filter(ImageFilter.GaussianBlur(24)))
          save_set('true-end-riverside-cg',bg,['game/assets/4k/backgrounds/true-dawn.png','game/assets/4k/characters/linwan/smile.png'],'True End, October 25 morning: Linwan smiling after the loop is broken; clear warm morning light and fresh dawn atmosphere, explicitly not dusk or sunset.')
          PY

      - name: Switch all five production CG references to 4K runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='game/content/zzz-scene-art-v1.json';
          const doc=JSON.parse(fs.readFileSync(path,'utf8'));
          const ids=new Set(['faceless-reflection-cg','letter-1842-cg','six-chairs-cg','linwan-1842-cg','true-end-riverside-cg']);
          const assets=doc.replaceAssets;
          if (!Array.isArray(assets)) throw new Error('replaceAssets list not found');
          let changed=0;
          for (const asset of assets) {
            if (asset && ids.has(asset.id)) {
              asset.src=`assets/4k/runtime/cg/${asset.id}.webp`;
              changed++;
            }
          }
          if (changed !== 5) throw new Error(`expected 5 CG refs, changed ${changed}`);
          fs.writeFileSync(path,JSON.stringify(doc,null,2)+'\n');
          NODE

      - name: Refresh audit and validate Round 5
        run: |
          npm run art:audit:write
          npm run art:audit
          npm run art:check
          npm run build
          npm run check:release
          npm run test:release

      - name: Record integration checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/ART_4K_ROUNDS.md')
          s=p.read_text(encoding='utf-8')
          old='## Round 5 — 5 个关键 CG\n\n进行中：ChatGPT 原图 → 3840×2160 PNG 母版 → 1920×1080 WebP。保持人物身份、CG ID、解锁逻辑与 True End 文本。'
          new='''## Round 5 — 5 个关键 CG\n\n资产接入完成，等待本提交的 GitHub Build / Release 双平台 CI 最终确认。五个 CG 已全部切换为 `assets/4k/runtime/cg/*.webp`，对应 3840×2160 PNG 母版保存在 `game/assets/4k/cg/`；provenance 与 SHA256 保存在 `game/art-sources/chatgpt/cg/`。\n\n- `faceless-reflection-cg`：雨中倒影提前动作。\n- `letter-1842-cg`：18:42 来信；恢复母版 PNG IDAT 问题已修复。\n- `six-chairs-cg`：六位女主 + 第七把空椅子。\n- `linwan-1842-cg`：北站 18:42，使用正式林晚 4K 立绘与正式北站 4K 场景合成，强化明显雨夜。\n- `true-end-riverside-cg`：使用正式林晚 4K 立绘与 `true-dawn` 4K 场景合成，明确 10 月 25 日暖晨光而非黄昏。\n\nRunner 门禁：`art:audit:write`、`art:audit`、`art:check`、`build`、`check:release`、`test:release` 全部通过后才允许提交。保持 `v1.2.0-dev`，不进入 RC，不覆盖正式 `v1.1.0 Pages`。'''
          if old not in s: raise SystemExit('Round 5 marker not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY

      - name: Commit generated assets and integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/assets/4k/cg game/assets/4k/runtime/cg game/art-sources/chatgpt/cg game/content/zzz-scene-art-v1.json docs/ART_4K_AUDIT.md docs/ART_4K_ROUNDS.md
          git commit -m 'art(cg): complete round five production assets'
          git push origin HEAD:main
