name: Round 7 UI asset builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round7-ui-assets.yml'

permissions:
  contents: write

jobs:
  build-ui-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick webp fonts-noto-cjk

      - name: Render Round 7 UI originals, masters and runtime derivatives
        run: |
          set -euo pipefail
          mkdir -p game/assets/4k/ui game/assets/4k/runtime/ui
          for id in title-key-visual save-anomaly ending-collection-header cg-gallery-header combat-hud-key-visual; do
            src="game/art-sources/chatgpt/ui/$id/source.svg"
            original="game/art-sources/chatgpt/ui/$id/original.png"
            master="game/assets/4k/ui/$id.png"
            runtime="game/assets/4k/runtime/ui/$id.webp"
            rsvg-convert -w 1920 -h 1080 "$src" -o "$original"
            convert "$original" -filter Lanczos -resize '3840x2160!' "$master"
            cwebp -quiet -q 92 "$original" -o "$runtime"
            identify "$original" "$master"
            webpinfo "$runtime" | grep 'Canvas size'
          done

      - name: Write provenance and SHA256
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          prompts={
            'title-key-visual':'RESET title key visual: rain-dark Wucheng, 18:42 clock glow, reflective wet atmosphere, distant human echoes, restrained blue-gray palette, elegant Chinese visual-novel title composition.',
            'save-anomaly':'RESET anomaly save key visual: corrupted save-slot architecture, repeated load traces, 10/17 18:42, warning chevrons, cold violet-blue interface ambience, unsettling but readable.',
            'ending-collection-header':'RESET ending collection key visual: six route seats and a seventh empty archive frame, memory residue, calm teal-gray gallery ambience, route-completion symbolism.',
            'cg-gallery-header':'RESET CG gallery key visual: layered surviving frames, rain-dark memory cards, clock and route fragments, archival photographic composition, cool desaturated palette.',
            'combat-hud-key-visual':'RESET combat HUD key visual: temporal targeting reticle, offset echo silhouette, stamina trace, pattern-reading and loop-breaking motifs, minimal cold blue-gray combat interface.'
          }
          for id,prompt in prompts.items():
              base=Path(f'game/art-sources/chatgpt/ui/{id}')
              files={
                  'sourceVector':base/'source.svg',
                  'original':base/'original.png',
                  'master':Path(f'game/assets/4k/ui/{id}.png'),
                  'runtime':Path(f'game/assets/4k/runtime/ui/{id}.webp')
              }
              sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
              record={
                  'schema':1,'generator':'ChatGPT-authored original vector illustration; deterministic raster master pipeline',
                  'workflow':'round7-new-vector-source-to-processed-4k-master','native4kClaim':False,
                  'authorization':'2026-10-27: 用户要求继续下一轮 Round 7 并沿用最高权限写入',
                  'category':'ui','id':id,'prompt':prompt,
                  'processing':'new ChatGPT-authored vector source -> rsvg 1920x1080 PNG original -> Lanczos 3840x2160 PNG master -> 1920x1080 WebP runtime; legacy UI SVG not used as pixels',
                  'sourceVector':str(files['sourceVector']),'sourceVectorSHA256':sha(files['sourceVector']),
                  'original':str(files['original']),'originalSize':[1920,1080],'originalSHA256':sha(files['original']),
                  'master':str(files['master']),'masterSize':[3840,2160],'masterSHA256':sha(files['master']),
                  'runtime':str(files['runtime']),'runtimeSize':[1920,1080],'runtimeSHA256':sha(files['runtime'])
              }
              (base/'provenance.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Refresh 4K audit
        run: npm run art:audit:write

      - name: Commit Round 7 UI assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/assets/4k/ui game/assets/4k/runtime/ui game/art-sources/chatgpt/ui docs/ART_4K_AUDIT.md
          git commit -m 'art(round7): build UI key visual 4K assets'
          git push origin HEAD:main
