name: R4 Editorial D Patch

on:
  push:
    branches:
      - r4-editorial-d

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r4-editorial-d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply global repetition and pacing cleanup
        run: python scripts/r4-editorial-d-patch.py
      - name: Commit Chapter 3 editorial cleanup
        shell: bash
        run: |
          if git diff --quiet -- game/content/chapters/03.json; then
            echo "No D changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/content/chapters/03.json
          git commit -m "refactor(editorial): clean R4 global repetition and pacing"
          git push origin HEAD:r4-editorial-d
