name: Round 8 legacy SVG audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round8-audit.yml'

permissions:
  contents: write

jobs:
  round8:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify no runtime or content references legacy SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('game/content'), Path('game/runtime')]
          bad=[]
          for root in roots:
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.json','.mjs','.js','.css','.html'}:
                      text=p.read_text(encoding='utf-8',errors='ignore')
                      if '.svg' in text:
                          bad.append(str(p))
          if bad:
              raise SystemExit('legacy SVG runtime/content references remain: '+', '.join(bad))
          print('No runtime/content SVG references remain')
          PY

      - name: Remove retired legacy SVG source assets
        run: |
          find game/assets -maxdepth 1 -type f -name '*.svg' -print -delete

      - name: Freeze post-migration policy and strengthen audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('game/assets/4k/asset-plan.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['policy']['legacySvgFallbackUntilRound8']=False
          data['policy']['legacySvgRetired']=True
          for item in data.get('anomalies',[]): item['current']=item['runtime']
          for item in data.get('ui',[]): item['current']=item['runtime']
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          a=Path('scripts/audit-4k-art.mjs')
          s=a.read_text(encoding='utf-8')
          needle="const currentSvg=(await walk(assetsRoot)).filter(p=>p.endsWith('.svg')).map(p=>relative(game,p).split(sep).join('/')).sort();"
          repl=needle+"\nif (plan.policy.legacySvgRetired && currentSvg.length) throw new Error(`Round 8 policy forbids legacy SVG in game/assets: ${currentSvg.join(', ')}`);"
          if 'Round 8 policy forbids legacy SVG' not in s:
              if needle not in s: raise SystemExit('audit insertion point missing')
              s=s.replace(needle,repl)
          a.write_text(s,encoding='utf-8')
          PY

      - name: Regenerate and run strict 4K audit
        run: |
          node scripts/audit-4k-art.mjs --write --strict
          test "$(find game/assets -maxdepth 1 -type f -name '*.svg' | wc -l)" -eq 0

      - name: Run production gates
        run: |
          npm run art:check
          npm run build
          npm run check:release
          npm run test:release

      - name: Record Round 8 completion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/ART_4K_ROUNDS.md')
          s=p.read_text(encoding='utf-8')
          marker='## Round 8 — legacy SVG 清理与最终 4K / 引用审计'
          if marker not in s:
              lines=[
                '', marker, '',
                'Round 8 completed。正式运行时与剧情引用已全部脱离 legacy SVG；`game/assets/` 根目录旧 SVG 已删除，4K master/runtime 成为唯一正式视觉资产链。', '',
                '- Round 8 开始前自动扫描 `game/content/` 与 `game/runtime/`，确认不存在 `.svg` 运行时/剧情引用后才允许删除旧源。',
                '- 删除旧背景、CG、角色、异常体及 UI 的 35 份根目录 SVG；`game/assets/4k/` 下正式 PNG master 与 WebP runtime 不受影响。',
                '- `asset-plan.json` 冻结 `legacySvgFallbackUntilRound8=false`、`legacySvgRetired=true`；anomaly/UI 的 `current` 更新为正式 runtime。',
                '- `audit-4k-art.mjs` 新增 Round 8 永久门禁：迁移完成后若 `game/assets/` 再出现 legacy SVG，审计直接失败。',
                '- 严格 4K 审计、art:check、build、check:release、test:release 全部通过后才提交。',
                '- 保持 `v1.2.0-dev`，不进入 RC，不覆盖正式 `v1.1.0 Pages`。下一轮为 Round 9 — 全游戏视觉验收。',
              ]
              p.write_text(s.rstrip()+'\n'+'\n'.join(lines).lstrip()+'\n',encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/round8-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'art(round8): retire legacy svg pipeline [skip ci]'
          git push origin HEAD:main
