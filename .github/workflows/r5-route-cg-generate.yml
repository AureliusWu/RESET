name: Generate R5 route CGs

on:
  push:
    branches: [r5-d-route-story-key-cg-expansion]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[r5-cg-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout R5 D branch
        uses: actions/checkout@v4
        with:
          ref: r5-d-route-story-key-cg-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate six route ending CGs
        run: python scripts/generate-r5-route-cgs.py
      - name: Integrate route CGs into story, Gallery and release gates
        run: python scripts/integrate-r5-route-cgs.py
      - name: Commit generated and integrated R5 D output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'R5 route CG output already matches generator and integration plan.'
            exit 0
          fi
          git commit -m 'art(r5-d): integrate route CG expansion [r5-cg-generated]'
          git push origin HEAD:r5-d-route-story-key-cg-expansion
