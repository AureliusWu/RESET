name: Generate R5 route CGs

on:
  push:
    branches: [r5-d-route-story-key-cg-expansion]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[r5-cg-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout R5 D branch
        uses: actions/checkout@v4
        with:
          ref: r5-d-route-story-key-cg-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate six route ending CGs
        run: python scripts/generate-r5-route-cgs.py
      - name: Commit generated masters, runtime derivatives and provenance
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/assets/4k/cg game/assets/4k/runtime/cg game/art-sources/chatgpt/cg
          if git diff --cached --quiet; then
            echo 'Route CG bytes already match the deterministic generator.'
            exit 0
          fi
          git commit -m 'art(r5-d): generate route CG masters [r5-cg-generated]'
          git push origin HEAD:r5-d-route-story-key-cg-expansion
