name: R4 Editorial D Final

on:
  push:
    branches:
      - r4-editorial-d

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r4-editorial-d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove final repeated Chapter 3 templates
        run: python scripts/r4-editorial-d-final.py
      - name: Commit final D cleanup
        shell: bash
        run: |
          if git diff --quiet -- game/content/chapters/03.json; then
            echo "No final D changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/content/chapters/03.json
          git commit -m "refactor(editorial): finish R4 repetition cleanup"
          git push origin HEAD:r4-editorial-d
