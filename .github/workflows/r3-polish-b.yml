name: R3 Polish Chapters 3-4

on:
  push:
    branches: [r3-narrative-b]

permissions:
  contents: write

jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'chore(r3): apply chapter 3-4 polish') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r3-narrative-b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrative polish
        run: |
          node scripts/r3-pre-b.mjs
          node scripts/r3-polish-b.mjs
      - name: Validate scenario
        run: npm run scenario:check
      - name: Commit polished chapters
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/content/chapters/03.json game/content/chapters/04.json
          git diff --cached --check
          git commit -m "chore(r3): apply chapter 3-4 polish"
          git push origin HEAD:r3-narrative-b
