name: Round 5 stale CG gate fixer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round5-ci-fix.yml'

permissions:
  contents: write

jobs:
  fix-stale-cg-gates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy True End SVG assertions with Round 5 runtime WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          old='assets/generated-scenes/true-end-riverside-cg.svg'
          new='assets/4k/runtime/cg/true-end-riverside-cg.webp'
          for name in ['.github/workflows/build.yml','tests/browser-release.mjs']:
            p=Path(name)
            s=p.read_text(encoding='utf-8')
            count=s.count(old)
            if count != 1:
              raise SystemExit(f'{name}: expected exactly one stale assertion, found {count}')
            p.write_text(s.replace(old,new),encoding='utf-8')
            print(name, 'updated')
          PY

      - name: Commit CI gate migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build.yml tests/browser-release.mjs
          git commit -m 'test(art): validate Round 5 CG runtime instead of legacy SVG'
          git push origin HEAD:main
