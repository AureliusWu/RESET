name: Round 5 finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round5-ci-fix.yml'

permissions:
  contents: write

jobs:
  finalize-round5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark Round 5 completed with CI evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/ART_4K_ROUNDS.md')
          s=p.read_text(encoding='utf-8')
          old='资产接入完成，等待本提交的 GitHub Build / Release 双平台 CI 最终确认。'
          new='Round 5 completed。5 个关键 CG 已正式接入并通过 Build / Web / Windows 双平台验收。'
          if old not in s:
            raise SystemExit('Round 5 pending marker not found')
          s=s.replace(old,new,1)
          anchor='保持 `v1.2.0-dev`，不进入 RC，不覆盖正式 `v1.1.0 Pages`。'
          evidence='''保持 `v1.2.0-dev`，不进入 RC，不覆盖正式 `v1.1.0 Pages`。\n\n### Round 5 completed\n\n- 4K 审计：production 56 / 56，4K_READY 56，planned 0，undersized 0。\n- Build 回留：Run `40357135795`，success。\n- Release 回留：Run `40357135682`，Web success，Windows success。\n- Web：最终 ZIP、PWA、离线缓存、浏览器验收通过。\n- Windows：原生 host、RESET.exe 启动链、最终 ZIP、重启与持久化验收通过。\n- 资产提交：`80958b048c35ba494011a1c71570a244637567f0`。\n- 最终验证触发提交：`f5f5f0a03341f8ad1ae24c384152f4d6c31ad071`。'''
          if anchor not in s:
            raise SystemExit('Round 5 anchor not found')
          s=s.replace(anchor,evidence,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit Round 5 completion record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ART_4K_ROUNDS.md
          git commit -m 'docs(art): mark round five completed [skip ci]'
          git push origin HEAD:main
