name: Release 回留

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: game-repo
      - name: Checkout locked VN Engine v2
        uses: actions/checkout@v4
        with:
          repository: AureliusWu/VN-Engine-v2
          ref: 15c101e0d2b2c1e40dbc36d7a0c1a246d102b52c
          path: vn-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vn-engine/package-lock.json
      - name: Install engine dependencies
        working-directory: vn-engine
        run: npm ci
      - name: Build standalone PWA
        working-directory: game-repo
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: npm run build
      - name: Validate candidate Web content and complete native art
        working-directory: game-repo
        run: |
          npm run check:release
          npm run art:r8
          node -e "const m=require('./dist/build-manifest.json');const p=require('./dist/project.json');if(m.game!=='reset'||p.version!=='reset-v1.3.0'||m.version!=='reset-v1.3.0')process.exit(1);if(!m.extensions.includes('reset-art-visual-gate-v1'))process.exit(2);if(!p.scenes.some(s=>s.ending==='true-end'))process.exit(3);console.log(m.engine,m.contentFingerprint,p.scenes.length,p.assets.length,m.extensions)"
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/pwa.mjs
          test -f dist/experience.css
      - name: Stable publication hard gate
        if: >-
          github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: publish v1.3.0')
        working-directory: game-repo
        run: npm run check:stable
      - name: Archive Web release
        working-directory: game-repo
        run: cd dist && zip -r ../RESET-huiliu-v1.3.0-web.zip .
      - name: Install acceptance browser
        working-directory: vn-engine
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Prepare immutable v1.2.3 upgrade fixture
        working-directory: game-repo
        run: |
          curl --fail --location --retry 3 https://github.com/AureliusWu/RESET/releases/download/v1.2.3/RESET-huiliu-v1.2.3-web.zip -o previous-web.zip
          echo 'b7a4a9e9d8afa7ef72d714444937df097e4d831a786e7eef9a6be67e895ca127  previous-web.zip' | sha256sum --check
          unzip -q previous-web.zip -d previous-web
      - name: Test extracted final Web ZIP
        working-directory: game-repo
        env:
          RESET_DIST: installed-web
          RESET_PREVIOUS_DIST: previous-web
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: |
          unzip -q RESET-huiliu-v1.3.0-web.zip -d installed-web
          npm run test:release
          npm run test:routes
      - name: Scripted UI player actors on the final Web ZIP
        working-directory: game-repo
        env:
          RESET_DIST: installed-web
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: npm run test:players
      - name: Upload independently reviewable player evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RESET-v1.3.0-player-observation
          path: game-repo/test-results/final-qa/players
          if-no-files-found: warn
      - name: Browser, PWA upgrade and audiovisual acceptance on the final Web ZIP
        working-directory: game-repo
        env:
          RESET_DIST: installed-web
          RESET_PREVIOUS_DIST: previous-web
          VN_ENGINE_PATH: ${{ github.workspace }}/vn-engine
        run: |
          npm run test:browser
          npm run test:music:browser
          npm run test:sfx:browser
          npm run test:direction:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RESET-huiliu-v1.3.0-web-validation
          path: game-repo/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: RESET-huiliu-v1.3.0-web
          path: game-repo/RESET-huiliu-v1.3.0-web.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: game-repo
      - name: Checkout locked VN Engine v2
        uses: actions/checkout@v4
        with:
          repository: AureliusWu/VN-Engine-v2
          ref: 15c101e0d2b2c1e40dbc36d7a0c1a246d102b52c
          path: vn-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vn-engine/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install engine dependencies
        working-directory: vn-engine
        run: npm ci
      - name: Build game content
        working-directory: game-repo
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}\vn-engine
        run: npm run build
      - name: Validate candidate Windows content and complete native art
        working-directory: game-repo
        run: |
          npm run check:release
          npm run art:r8
      - name: Stable publication hard gate
        if: >-
          github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: publish v1.3.0')
        working-directory: game-repo
        run: npm run check:stable
      - name: Publish native engine host
        run: dotnet publish vn-engine/hosts/windows/VNEngine.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o package/engine
      - name: Publish 回留 launcher
        run: dotnet publish game-repo/launcher/RESET.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o package/launcher
      - name: Assemble Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/game | Out-Null
          Copy-Item game-repo/dist/* package/game -Recurse
          Copy-Item package/launcher/RESET.exe package/RESET.exe
          Copy-Item game-repo/README.md package/README.md
          Copy-Item game-repo/LICENSE.md package/LICENSE.md
          Copy-Item vn-engine/LICENSE package/ENGINE-LICENSE.txt
          Copy-Item vn-engine/THIRD_PARTY_NOTICES.md package/ENGINE-THIRD-PARTY-NOTICES.md
          Copy-Item vn-engine/licenses package/engine-licenses -Recurse
          if (!(Test-Path package/engine/VNEngine.exe)) { throw 'VNEngine.exe missing' }
          if (!(Test-Path package/game/project.json)) { throw 'game project missing' }
          if (!(Test-Path package/game/combat.mjs)) { throw 'combat runtime missing' }
          if (!(Test-Path package/game/meta.mjs)) { throw 'meta runtime missing' }
          if (!(Test-Path package/RESET.exe)) { throw 'RESET launcher missing' }
      - name: Native host policy and actual RESET startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force test-results/windows | Out-Null
          $Engine = [IO.Path]::GetFullPath('package/engine/VNEngine.exe')
          $Game = [IO.Path]::GetFullPath('package/game')
          $Profile = [IO.Path]::GetFullPath('test-results/windows/game-profile')
          $Report = [IO.Path]::GetFullPath('test-results/windows/host-policy.json')
          $Self = Start-Process -FilePath $Engine -ArgumentList @('--self-test','--report',('"' + $Report + '"')) -PassThru
          if (-not $Self.WaitForExit(30000)) { Stop-Process -Id $Self.Id -Force; throw 'host-policy timed out' }
          if ($Self.ExitCode -ne 0 -or !(Test-Path $Report)) { throw 'host-policy failed' }
          $Policy = Get-Content $Report -Raw | ConvertFrom-Json
          if ($Policy.result -ne 'passed') { throw 'host-policy report failed' }
          $Native = Start-Process -FilePath $Engine -ArgumentList @('--game',('"' + $Game + '"'),'--user-data-dir',('"' + $Profile + '"')) -PassThru
          $Deadline = (Get-Date).AddSeconds(25)
          $Ready = $false
          while ((Get-Date) -lt $Deadline -and -not $Native.HasExited) {
            Start-Sleep -Milliseconds 500
            $Native.Refresh()
            if ($Native.MainWindowTitle -like '回留*VN Engine*' -and (Test-Path $Profile)) { $Ready = $true; break }
          }
          if (-not $Ready) {
            if (-not $Native.HasExited) { Stop-Process -Id $Native.Id -Force }
            throw 'actual RESET game did not reach a native window with a WebView2 profile'
          }
          Stop-Process -Id $Native.Id -Force
          $Native.WaitForExit(10000) | Out-Null
          $BeforeIds = @((Get-Process VNEngine -ErrorAction SilentlyContinue).Id)
          $Launcher = Start-Process -FilePath ([IO.Path]::GetFullPath('package/RESET.exe')) -PassThru
          if (-not $Launcher.WaitForExit(20000)) { Stop-Process -Id $Launcher.Id -Force; throw 'RESET launcher timed out' }
          if ($Launcher.ExitCode -ne 0) { throw "RESET launcher failed with exit $($Launcher.ExitCode)" }
          $Deadline = (Get-Date).AddSeconds(20)
          $Spawned = $null
          while ((Get-Date) -lt $Deadline) {
            Start-Sleep -Milliseconds 500
            $Spawned = Get-Process VNEngine -ErrorAction SilentlyContinue | Where-Object { $_.Id -notin $BeforeIds } | Select-Object -First 1
            if ($Spawned) { break }
          }
          if (-not $Spawned) { throw 'RESET.exe did not launch a new native VN Engine game process' }
          $Spawned.Refresh()
          if ($Spawned.HasExited) { throw 'launcher-spawned VN Engine exited immediately' }
          Get-Process VNEngine -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Archive Windows release
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath RESET-huiliu-v1.3.0-win-x64.zip
      - name: Test actual installed Windows ZIP and process restart
        working-directory: game-repo
        env:
          VN_ENGINE_PATH: ${{ github.workspace }}\vn-engine
        shell: pwsh
        run: |
          Expand-Archive ../RESET-huiliu-v1.3.0-win-x64.zip -DestinationPath ../installed-windows
          $env:RESET_DIST = '../installed-windows/game'
          npm run test:release
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows runtime regressions failed' }
          npm run test:routes
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows decision-path matrix failed' }
          $Policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $Policy -Force | Out-Null
          $Prior = (Get-Item -Path $Policy).GetValue('VNEngine.exe', $null)
          New-ItemProperty -Path $Policy -Name 'VNEngine.exe' -Value '--remote-debugging-port=9223 --remote-debugging-address=127.0.0.1' -PropertyType String -Force | Out-Null
          try {
            node tests/windows-launch.mjs ../installed-windows
            if ($LASTEXITCODE -ne 0) { throw 'Installed Windows acceptance failed' }
          } finally {
            if ($null -eq $Prior) { Remove-ItemProperty -Path $Policy -Name 'VNEngine.exe' -ErrorAction SilentlyContinue }
            else { Set-ItemProperty -Path $Policy -Name 'VNEngine.exe' -Value $Prior }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RESET-huiliu-v1.3.0-windows-validation
          path: |
            test-results/windows/host-policy.json
            game-repo/test-results/direction-r1/*.json
            game-repo/test-results/sfx-r1/*.json
            game-repo/test-results/music-r1/*.json
            game-repo/test-results/windows-installed/*.json
            game-repo/test-results/windows-installed/*.png
            game-repo/test-results/final-qa/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: RESET-huiliu-v1.3.0-win-x64
          path: RESET-huiliu-v1.3.0-win-x64.zip

  publish:
    needs: [web, windows]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: publish v1.3.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require recorded visual acceptance before publication
        run: npm run art:visual:release
      - name: Require matching main Build CI
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'build.yml', head_sha: context.sha});
              const run = data.workflow_runs.find(run => run.head_sha === context.sha && run.event === 'push');
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Matching Build CI failed');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('Matching Build CI did not finish');
      - uses: actions/download-artifact@v4
        with:
          name: RESET-huiliu-v1.3.0-web
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: RESET-huiliu-v1.3.0-win-x64
          path: release-assets
      - name: Create immutable annotated tag after all acceptance gates
        uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const head = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data.commit.sha;
            if (head !== context.sha) throw new Error('A newer main commit superseded this candidate; refusing to publish');
            let ref;
            try { ref = (await github.rest.git.getRef({...repo, ref: 'tags/v1.3.0'})).data; } catch (e) { if (e.status !== 404) throw e; }
            if (ref) {
              const sha = ref.object.type === 'tag' ? (await github.rest.git.getTag({...repo, tag_sha: ref.object.sha})).data.object.sha : ref.object.sha;
              if (sha !== context.sha) throw new Error('v1.3.0 already points to another commit; never move a published tag');
            } else {
              const {data: tag} = await github.rest.git.createTag({...repo, tag: 'v1.3.0', message: '回留 / RESET v1.3.0 — verified editorial, UI/UX, audio, direction and full-route Web/PWA and Windows release', object: context.sha, type: 'commit'});
              await github.rest.git.createRef({...repo, ref: 'refs/tags/v1.3.0', sha: tag.sha});
            }
      - name: Publish verified Web/PWA and Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd release-assets
          sha256sum RESET-huiliu-v1.3.0-web.zip RESET-huiliu-v1.3.0-win-x64.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          if gh release view v1.3.0 --json isDraft > release-state.json 2>/dev/null; then
            node -e "if(!require('./release-state.json').isDraft)throw Error('v1.3.0 is already public; refusing to replace immutable release assets')"
          else
            gh release create v1.3.0 --verify-tag --draft --title '《回留 / RESET》v1.3.0 — Web/PWA + Windows' --notes-file CHANGELOG_v1.3.0.md
          fi
          gh release upload v1.3.0 release-assets/RESET-huiliu-v1.3.0-web.zip release-assets/RESET-huiliu-v1.3.0-win-x64.zip release-assets/SHA256SUMS.txt --clobber
          gh release edit v1.3.0 --draft=false --latest --title '《回留 / RESET》v1.3.0 — Web/PWA + Windows' --notes-file CHANGELOG_v1.3.0.md
          gh release view v1.3.0 --json url,tagName,isDraft,assets
