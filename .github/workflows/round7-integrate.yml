name: Round 7 completion recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round7-integrate.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write Round 7 completion evidence
        run: python scripts/round7-integrate.py

      - name: Remove one-shot Round 7 automation and commit record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ART_4K_ROUNDS.md
          git rm .github/workflows/round7-ui-assets.yml .github/workflows/round7-integrate.yml scripts/round7-integrate.py docs/ROUND7_CI_TRIGGER.md
          git commit -m 'docs(round7): mark UI migration completed [skip ci]'
          git push origin HEAD:main
