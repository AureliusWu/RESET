name: Round 7 UI integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round7-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Round 7 integration patch
        run: python scripts/round7-integrate.py

      - name: Commit Round 7 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build.mjs scripts/check-release.mjs scripts/check-4k-production.mjs game/runtime/experience.css
          git commit -m 'feat(round7): integrate 4K UI key visuals'
          git push origin HEAD:main
