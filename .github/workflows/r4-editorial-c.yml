name: R4 Editorial C

on:
  push:
    branches:
      - r4-editorial-c

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r4-editorial-c
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply R4 editorial patch C
        run: python scripts/r4-editorial-c.py
      - name: Commit patched chapters
        shell: bash
        run: |
          if git diff --quiet -- game/content/chapters/05.json game/content/chapters/06.json game/content/chapters/07.json; then
            echo "No editorial changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/content/chapters/05.json game/content/chapters/06.json game/content/chapters/07.json
          git commit -m "refactor(editorial): sharpen R4 save room and true ending"
          git push origin HEAD:r4-editorial-c
