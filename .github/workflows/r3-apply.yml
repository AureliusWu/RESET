name: R3 Apply Narrative Polish

on:
  push:
    branches: [r3-narrative-a]

permissions:
  contents: write

jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'chore(r3): apply chapter 1-2 polish') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: r3-narrative-a
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply R3 prose polish
        run: |
          sed -i 's/beforeHan \* 0.97/beforeHan * 0.94/' scripts/r3-polish.mjs
          node scripts/r3-polish.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'game/content/chapters/01.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const lines = data.scenes.flatMap((scene) => scene.lines || []);
          const replacements = {
            r1_prologue_1842_pre06_01: '这时的梧城仍像任何一个十月的普通城市：校门口堵着接孩子的车，便利店微波炉叮地一响，雨伞边缘不停往地砖上滴水，晚高峰的人只关心什么时候能回家。',
            r1_prologue_1842_post03_01: '班群还在不停弹消息：明天要交的练习、体育课会不会改室内、谁把充电器忘在讲台。有人发了个催作业的表情包，下面立刻跟了十几条抱怨。陈渡一条也没屏蔽。',
          };
          for (const [id, text] of Object.entries(replacements)) {
            const target = lines.find((line) => line.id === id);
            if (!target) throw new Error(`R3 line not found: ${id}`);
            if (text.length > 80) throw new Error(`R3 replacement too long: ${id}:${text.length}`);
            target.text = text;
          }
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Validate scenario structure
        run: npm run scenario:check

      - name: Commit polished chapters
        shell: bash
        run: |
          if git diff --quiet -- game/content/chapters/01.json game/content/chapters/02.json; then
            echo "No chapter changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/content/chapters/01.json game/content/chapters/02.json
          git diff --cached --check
          git commit -m "chore(r3): apply chapter 1-2 polish"
          git push origin HEAD:r3-narrative-a
