name: R4 Editorial D Audit

on:
  push:
    branches:
      - r4-editorial-d

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r4-editorial-d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Chapter 3 repetition
        run: python scripts/r4-editorial-d-audit.py
